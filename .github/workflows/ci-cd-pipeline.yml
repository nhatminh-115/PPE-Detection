name: CI/CD Pipeline
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'
  pull_request:
    branches:
      - main

jobs:
  Continuous-Integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install fastapi jinja2 mlflow numpy pandas Pillow \
                      python-dotenv python-multipart requests \
                      supabase==2.3.4 uvicorn pytest httpx groq

      - name: Install Lightweight Test Dependencies
        run: |
          pip install --upgrade pip
          pip install fastapi httpx pytest supabase mlflow

      - name: Execute System Tests
        env:
          SUPABASE_URL: "https://mock.supabase.co"
          SUPABASE_KEY: "mock_key"
          MLFLOW_TRACKING_URI: "https://mock.dagshub.com"
        run: python -m pytest tests/ -v

  Continuous-Delivery:
    needs: Continuous-Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Monolithic Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ppe_system:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ppe_system:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/ppe_system:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/ppe_system:buildcache,mode=max