name: Daily PPE Report

on:
  schedule:
    - cron: "0 16 * * *"  
  workflow_dispatch:   

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install fastapi==0.135.1 starlette==0.47.3 jinja2==3.1.6 \
                      httpx==0.27.2 pytest==8.4.2 supabase==2.3.4 mlflow \
                      numpy pandas Pillow python-dotenv==1.0.0 \
                      python-multipart==0.0.20 requests==2.32.5 uvicorn==0.35.0 groq \
                      chromadb sentence-transformers pdfplumber

      - name: Run report service
        env:
          SUPABASE_URL:        ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python report_service.py