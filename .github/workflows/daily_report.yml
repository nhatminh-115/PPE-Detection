name: Daily PPE Report

on:
  schedule:
    - cron: "0 16 * * *"   # 23:00 ICT (UTC+7) — end of day
  workflow_dispatch:
    inputs:
      date:
        description: "Report date (YYYY-MM-DD, ICT). Leave blank for today."
        required: false
        default: ""

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            supabase==2.28.3 \
            python-dotenv==1.0.0 \
            requests==2.32.5 \
            groq \
            langgraph \
            langchain-groq \
            chromadb \
            sentence-transformers \
            pdfplumber \
            Pillow \
            numpy \
            boto3

      - name: Run daily pipeline
        env:
          SUPABASE_URL:          ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:  ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY:          ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
          REPORT_USE_LANGGRAPH:  "1"
          SECOND_OPINION_THRESHOLD: "1.0"
          S3_BUCKET:             ${{ secrets.S3_BUCKET }}
          S3_PREFIX:             ${{ vars.S3_PREFIX || 'ppe-flywheel' }}
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION:    ${{ vars.AWS_DEFAULT_REGION || 'us-east-1' }}
          DRIFT_THRESHOLD:       "0.25"
        run: |
          DATE="${{ github.event.inputs.date }}"
          if [ -n "$DATE" ]; then
            python run_daily_pipeline.py "$DATE"
          else
            python run_daily_pipeline.py
          fi
